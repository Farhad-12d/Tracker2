<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tracker</title><meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style id="pg">@page{size:A4 portrait;margin:8mm}</style>
<style>
:root{--bg:#f3f4f8;--cd:#fff;--tx:#1b2033;--mu:#667085;--ln:#d6d9e3;--nv:#1F2A44;--gd:#C9A227;--c1:#2563eb;--c2:#16a34a;--c3:#e11d48;--c4:#7c3aed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121b;--cd:#181c28;--tx:#e8eaf2;--mu:#9aa1b5;--ln:#2c3144;--nv:#26345a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f121b;--cd:#181c28;--tx:#e8eaf2;--mu:#9aa1b5;--ln:#2c3144;--nv:#26345a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{background:var(--nv);color:#fff;padding:14px 16px;border-bottom:3px solid var(--gd)}
header h1{margin:0;font-size:20px}header small{color:var(--gd)}
main{max-width:980px;margin:0 auto;padding:10px}
.sec{display:none}.sec.on{display:block}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.bar .sp{flex:1}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--nv);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.g{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}
button.on{background:var(--gd);color:#1b1b1b}
input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--nv);flex:none}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--nv)}
@media(prefers-color-scheme:dark){.card h3{color:var(--gd)}}
.day{display:grid;gap:0}.colR{order:-1}
@media(min-width:760px){.day{grid-template-columns:1fr 1.15fr;gap:10px}.colR{order:0}}
.r{display:grid;grid-template-columns:78px 1fr 64px;gap:6px;margin-bottom:6px;align-items:center}
.r2{display:grid;grid-template-columns:120px 1fr;gap:6px;margin-bottom:6px;align-items:center;font-size:13px}
.pl{display:grid;grid-template-columns:48px 1fr;gap:4px;margin-bottom:3px;align-items:center;font-size:13px}
.pl b{color:var(--mu)}
.ck{display:flex;gap:8px;align-items:center;padding:5px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.pray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pray label{border:1px solid var(--ln);border-radius:8px;padding:8px 2px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.mw{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;background:var(--cd)}
table{border-collapse:collapse;font-size:11px;width:max-content}
th,td{border:1px solid var(--ln);padding:0;text-align:center;height:26px;min-width:26px}
th.l{position:sticky;left:0;background:var(--cd);text-align:left;padding:0 6px;min-width:132px;z-index:1;white-space:nowrap}
thead th{background:var(--nv);color:#fff}thead th.l{background:var(--nv)}
td input[type=number]{width:30px;border:0;border-radius:0;padding:2px;text-align:center;background:transparent;font-size:11px}
td input[type=checkbox]{width:16px;height:16px;margin:4px}
tr.h th{background:var(--gd);color:#111}
.lg{display:flex;gap:12px;font-size:12px;margin:4px 0;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.sum{font-size:13px;color:var(--mu);margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:14px}
nav button.on{color:var(--nv);font-weight:700;box-shadow:inset 0 3px var(--gd)}
@media(prefers-color-scheme:dark){nav button.on{color:var(--gd)}}
@media print{.np{display:none!important}body{background:#fff;color:#000;font-size:10px;padding:0}:root{--cd:#fff;--tx:#000;--ln:#999;--mu:#444;--nv:#1F2A44}
header{padding:6px 10px}.card{border:1px solid #999;padding:5px;margin-bottom:5px;break-inside:avoid}.day{grid-template-columns:1fr 1.15fr;gap:6px}.colR{order:0}
input,textarea{border:0!important;border-bottom:1px solid #aaa!important;border-radius:0!important;background:none!important;padding:1px 2px!important}textarea{min-height:34px}
.pl{margin-bottom:1px}.mw{overflow:visible;border:0}table{width:100%;font-size:7px}th.l{position:static;min-width:80px}td input[type=number]{width:100%}th,td{min-width:0;height:19px}main{padding:0}}
</style></head><body>
<header><h1>Daily Tracker</h1><small id="hd"></small></header>
<main>
<section class="sec on" id="s-day">
 <div class="bar np"><button class="g" onclick="mv(-1)">‹</button><input type="date" id="dt" style="width:auto"><button class="g" onclick="mv(1)">›</button><button class="g" onclick="setD(iso(new Date()))">Today</button><span class="sp"></span><button onclick="pr('portrait')">Print day</button></div>
 <div class="day" id="day"></div>
</section>
<section class="sec" id="s-month">
 <div class="bar np"><input type="month" id="mn" style="width:auto"><span class="sp"></span><button onclick="pr('landscape')">Print month</button></div>
 <div class="card"><h3>Main goal this month</h3><input type="text" data-m="goal"></div>
 <div class="mw"><table id="mt"></table></div>
 <div class="g2" style="margin-top:10px;display:grid"><div class="card"><h3>Targets</h3><textarea data-m="targets"></textarea></div><div class="card"><h3>Best habit &amp; biggest win</h3><textarea data-m="win"></textarea></div></div>
 <div class="card"><h3>Fix next month</h3><textarea data-m="fix"></textarea></div>
</section>
<section class="sec" id="s-graphs">
 <div class="bar np"><button class="g" data-r="7">7 days</button><button class="g" data-r="14">14 days</button><button class="g" data-r="30">30 days</button><span class="sp"></span><button onclick="pr('portrait')">Print graphs</button></div>
 <div id="gr"></div>
</section>
</main>
<nav class="np"><button data-t="day" class="on">Day</button><button data-t="month">Month</button><button data-t="graphs">Graphs</button></nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let D={days:{},months:{}};try{D=JSON.parse(localStorage.getItem('ft1'))||D}catch(e){}
const save=()=>{try{localStorage.setItem('ft1',JSON.stringify(D))}catch(e){}};
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const g=k=>D.days[k]||{},day=k=>D.days[k]||(D.days[k]={}),num=v=>parseFloat(v)||0;
let cur=iso(new Date()),mon=cur.slice(0,7),range=7;
const PR=[['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const HB=[['h_wake','Woke up on time'],['h_ex','Exercise / football'],['h_phone','Phone-free study'],['h_rev','Revised notes'],['h_meal','Healthy meals'],['h_sleep','Slept on time']];
const SB=[['phy','Physics'],['chem','Chemistry'],['bio','Biology']];
const ck=(k,l)=>`<label class="ck"><input type="checkbox" data-c="${k}"><span>${l}</span></label>`;
function build(){
 let pl='';for(let h=5;h<=22;h++)pl+=`<div class="pl"><b>${h%12||12} ${h<12?'AM':'PM'}</b><input type="text" data-f="p${h}"></div>`;
 let pri='';for(let i=1;i<=3;i++)pri+=`<div class="ck"><input type="checkbox" data-c="pd${i}"><input type="text" data-f="pr${i}" placeholder="Priority ${i}"></div>`;
 let st=SB.map(([k,l])=>`<div class="r"><b>${l}</b><input type="text" data-f="t_${k}" placeholder="Topic / lesson"><input type="number" step="0.25" min="0" data-f="s_${k}" placeholder="hrs"></div>`).join('');
 let bz=[['orders','Orders to dispatch'],['pay','Payments to collect (Rs)'],['msg','Customers to message'],['jobs','Print jobs due today']].map(([k,l])=>`<div class="r2"><span>${l}</span><input type="text" data-f="b_${k}"></div>`).join('');
 let w='';for(let i=1;i<=8;i++)w+=`<input type="checkbox" data-c="w${i}">`;
 $('#day').innerHTML=`<div class="colL"><div class="card"><h3>Time plan</h3>${pl}</div></div><div class="colR">
 <div class="card"><h3>Main goal today</h3><input type="text" data-f="goal"></div>
 <div class="card"><h3>Five daily prayers</h3><div class="pray">${PR.map(([k,l])=>`<label>${l}<input type="checkbox" data-c="${k}"></label>`).join('')}</div></div>
 <div class="card"><h3>Top 3 priorities</h3>${pri}</div>
 <div class="card"><h3>Study log</h3>${st}<div class="sum">Total study: <b id="tot">0</b> hrs</div></div>
 <div class="card"><h3>Business: print shop &amp; online shop</h3>${bz}</div>
 <div class="card"><h3>Habits</h3><div class="g2">${HB.map(([k,l])=>ck(k,l)).join('')}</div></div>
 <div class="card"><h3>Water &amp; phone</h3><div class="water">${w}</div><div class="r2" style="margin-top:8px"><span>Phone screen time (hrs)</span><input type="number" step="0.25" min="0" data-f="phone"></div></div>
 <div class="card"><h3>End-of-day review</h3><textarea data-f="wins" placeholder="3 wins today"></textarea><textarea data-f="fix" placeholder="Fix / improve tomorrow"></textarea><textarea data-f="notes" placeholder="Notes &amp; ideas"></textarea><div class="r2"><span>Day score (/10)</span><input type="number" min="0" max="10" data-f="score"></div></div></div>`;
}
function loadDay(){
 const d=g(cur);$('#dt').value=cur;
 $$('#day [data-f]').forEach(e=>e.value=d[e.dataset.f]??'');
 $$('#day [data-c]').forEach(e=>e.checked=!!d[e.dataset.c]);
 $('#hd').textContent=new Date(cur+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 tot();
}
const tot=()=>{const d=g(cur);$('#tot').textContent=+SB.reduce((s,[k])=>s+num(d['s_'+k]),0).toFixed(2)};
const setD=k=>{cur=k||cur;mon=cur.slice(0,7);loadDay()};
const mv=n=>{const d=new Date(cur+'T00:00');d.setDate(d.getDate()+n);setD(iso(d))};
$('#dt').onchange=e=>e.target.value&&setD(e.target.value);
$('#day').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(f){day(cur)[f]=t.value;save();tot()}});
$('#day').addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(c){day(cur)[c]=t.checked;save()}});
// month
const MR=[...PR.map(([k,l])=>[l,k,'b']),...HB.map(([k,l])=>[l,k,'b']),['Water (8 glasses)','w8','b'],'H',...SB.map(([k,l])=>[l+' (hrs)','s_'+k,'n']),['Total study (hrs)','T','t'],['Phone screen time (hrs)','phone','n']];
function renderMonth(){
 $('#mn').value=mon;const [y,m]=mon.split('-').map(Number),n=new Date(y,m,0).getDate();
 let h='<thead><tr><th class="l">Day</th>';for(let i=1;i<=n;i++)h+=`<th>${i}</th>`;h+='</tr></thead><tbody>';
 MR.forEach(r=>{
  if(r==='H'){h+=`<tr class="h"><th class="l" colspan="${n+1}">Study &amp; phone hours</th></tr>`;return}
  h+=`<tr><th class="l">${r[0]}</th>`;
  for(let i=1;i<=n;i++){const dk=mon+'-'+p2(i),v=g(dk)[r[1]];
   h+=r[2]=='b'?`<td><input type="checkbox" data-d="${dk}" data-k="${r[1]}" ${v?'checked':''}></td>`:r[2]=='n'?`<td><input type="number" step="0.25" min="0" data-d="${dk}" data-k="${r[1]}" value="${v??''}"></td>`:`<td id="t${i}">${+SB.reduce((s,[k])=>s+num(g(dk)['s_'+k]),0).toFixed(1)||''}</td>`}
  h+='</tr>'});
 $('#mt').innerHTML=h+'</tbody>';
 const M=D.months[mon]||{};$$('[data-m]').forEach(e=>e.value=M[e.dataset.m]??'');
}
$('#mt').addEventListener('input',e=>wr(e.target));$('#mt').addEventListener('change',e=>wr(e.target));
function wr(t){const dk=t.dataset.d;if(!dk)return;day(dk)[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;save();
 const c=$('#t'+num(dk.slice(8)));if(c)c.textContent=+SB.reduce((s,[k])=>s+num(g(dk)['s_'+k]),0).toFixed(1)||''}
$$('[data-m]').forEach(e=>e.addEventListener('input',()=>{(D.months[mon]=D.months[mon]||{})[e.dataset.m]=e.value;save()}));
$('#mn').onchange=e=>{if(e.target.value){mon=e.target.value;renderMonth()}};
// graphs
function chart(ds,ser,cols,minMax){
 const W=340,H=170,L=28,B=20,T=8,pw=W-L-4,ph=H-B-T,n=ds.length,bw=pw/n,w=Math.max(bw*.7,2);
 const tt=ds.map((_,i)=>ser.reduce((s,a)=>s+a[i],0));let mx=Math.ceil(Math.max(...tt,minMax||1));
 let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let k=0;k<=4;k++){const y=T+ph-ph*k/4;o+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${L-4}" y="${y+3}" font-size="8" text-anchor="end" fill="var(--mu)">${+(mx*k/4).toFixed(1)}</text>`}
 ds.forEach((d,i)=>{let y=T+ph;const x=L+i*bw+(bw-w)/2;ser.forEach((a,j)=>{const h=ph*a[i]/mx;y-=h;o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cols[j]}" rx="1"/>`});
  if(n<=14||i%Math.ceil(n/10)==0)o+=`<text x="${x+w/2}" y="${H-6}" font-size="8" text-anchor="middle" fill="var(--mu)">${+d.slice(8)}</text>`});
 return o+'</svg>'}
function renderGraphs(){
 const t=new Date(),ds=[];for(let i=range-1;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);ds.push(iso(d))}
 const S=SB.map(([k])=>ds.map(d=>num(g(d)['s_'+k]))),P=ds.map(d=>num(g(d).phone)),Pr=ds.map(d=>PR.filter(([k])=>g(d)[k]).length);
 const avg=a=>+(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2),cols=['var(--c1)','var(--c2)','var(--c3)'];
 $('#gr').innerHTML=`<div class="card"><h3>Study hours per day</h3><div class="lg">${SB.map(([k,l],i)=>`<span><i style="background:${cols[i]}"></i>${l}</span>`).join('')}</div>${chart(ds,S,cols)}<div class="sum">Daily average: ${SB.map(([k,l],i)=>l+' '+avg(S[i])+' h').join(' · ')}</div></div>
 <div class="card"><h3>Phone usage (hrs per day)</h3>${chart(ds,[P],['var(--c4)'])}<div class="sum">Daily average: ${avg(P)} h</div></div>
 <div class="card"><h3>Prayers completed (out of 5)</h3>${chart(ds,[Pr],['var(--gd)'],5)}<div class="sum">Average: ${avg(Pr)} of 5 · Full days: ${Pr.filter(x=>x==5).length}</div></div>`;
 $$('[data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r==range))}
$$('[data-r]').forEach(b=>b.onclick=()=>{range=+b.dataset.r;renderGraphs()});
// nav + print
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x==b));$$('.sec').forEach(s=>s.classList.toggle('on',s.id=='s-'+b.dataset.t));
 if(b.dataset.t=='month')renderMonth();if(b.dataset.t=='graphs')renderGraphs();if(b.dataset.t=='day')loadDay();scrollTo(0,0)});
function pr(o){$('#pg').textContent='@page{size:A4 '+o+';margin:8mm}';print()}
build();loadDay();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script></body></html>
